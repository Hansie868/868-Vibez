<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
  <meta name="theme-color" content="#060606"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="868 Vibez"/>
  <title>868 Vibez</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<!-- ═══ SPLASH — tap to enter ═══ -->
<div id="splash">
  <img src="icons/splash-cover.jpg" alt="868 Vibez — 868 Apps Hub Ltd™"/>
  <div class="splash-tap">TAP TO ENTER</div>
</div>

<!-- Copy-fallback folder input (only used where in-place access is unsupported) -->
<input type="file" id="copyFolderInput" webkitdirectory multiple accept="audio/*" style="display:none"/>

<main class="tabs">

  <!-- ═══ TAB 1 — MP3 PLAYER ═══ -->
  <section class="tab-page on" id="tab-player">
    <header class="brand-head">
      <div>
        <div class="brand-kicker">868 APPS HUB LTD™</div>
        <div class="brand-name">868 Vibez</div>
      </div>
      <div class="head-btns">
        <button class="btn primary" id="npImportBtn">＋ Import</button>
        <button class="gear" id="settingsBtn">⚙</button>
      </div>
    </header>

    <div class="np-stage">
      <div class="vinyl" id="npVinyl">
        <img src="icons/vinyl-art.jpg" alt=""/>
        <div class="vinyl-hole"></div>
      </div>
      <div class="np-title" id="npTitle">No track playing</div>
      <div class="np-artist" id="npArtist">Add a folder, then pick a song</div>
    </div>

    <div class="np-controls">
      <input type="range" id="npSeek" min="0" max="1000" value="0"/>
      <div class="np-times"><span id="npTimeCur">0:00</span><span id="npTimeDur">0:00</span></div>
      <div class="np-transport">
        <button class="np-side" id="npPrevBtn">⏮</button>
        <button class="np-play" id="npPlayBtn">▶</button>
        <button class="np-side" id="npNextBtn">⏭</button>
      </div>
      <div class="np-extras">
        <button class="np-extra" id="npQueueBtn"><span>≡</span>QUEUE</button>
        <button class="np-extra fav" id="npFavBtn"><span>♥</span>FAVORITE</button>
      </div>
    </div>
  </section>

  <!-- ═══ TAB 2 — RADIO HUB ═══ -->
  <section class="tab-page" id="tab-radio">
    <header class="brand-head">
      <div>
        <div class="brand-kicker">TRINIDAD &amp; TOBAGO</div>
        <div class="brand-name">Radio Hub</div>
      </div>
    </header>
    <div class="scroll-body" id="radioBody"></div>
  </section>

  <!-- ═══ TAB 3 — LIBRARY ═══ -->
  <section class="tab-page" id="tab-library">
    <header class="brand-head">
      <div>
        <div class="brand-kicker">YOUR MUSIC</div>
        <div class="brand-name">Library</div>
      </div>
    </header>
    <div class="scroll-body" id="libBody"></div>
  </section>

  <!-- ═══ TAB 4 — DJ CONSOLE ═══ -->
  <section class="tab-page dj" id="tab-dj">
    <!-- Portrait: rotate gate -->
    <div class="rotate-gate">
      <img src="icons/vinyl-art.jpg" class="gate-art" alt=""/>
      <div class="gate-icon">📱↻</div>
      <div class="gate-text">Rotate your phone<br><span>to enter the booth</span></div>
    </div>
    <!-- Landscape: the console -->
    <div class="dj-wrap">
      <nav class="dj-subtabs">
        <button class="dj-subtab on" data-sub="decks">DECKS</button>
        <button class="dj-subtab" data-sub="music">MUSIC</button>
        <button class="dj-subtab" data-sub="toolkit">TOOLKIT</button>
        <button class="dj-subtab" data-sub="more">MORE</button>
      </nav>
      <div class="dj-body" id="djBody"></div>
    </div>
  </section>

</main>

<!-- ═══ BOTTOM NAV ═══ -->
<nav class="bottom-nav">
  <button class="nav-btn on" data-tab="player"><span>🎵</span>Player</button>
  <button class="nav-btn" data-tab="radio"><span>📻</span>Radio</button>
  <button class="nav-btn" data-tab="library"><span>📁</span>Library</button>
  <button class="nav-btn" data-tab="dj"><span>🎧</span>DJ</button>
</nav>

<script defer src="db.js"></script>
<script defer src="engine.js"></script>
<script defer src="shell.js"></script>
<script defer src="library.js"></script>
<script defer src="player.js"></script>
<script defer src="radio.js"></script>
<script defer src="dj.js"></script>
</body>
</html>
